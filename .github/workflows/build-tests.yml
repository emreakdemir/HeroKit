name: Build & Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the coverage badge to the badges branch
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: coverage/**/coverage.cobertura.xml
          targetdir: coverage/report
          reporttypes: MarkdownSummaryGithub;Cobertura;Badges

      - name: Coverage summary
        run: cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      # Keeps the README coverage badge current without an external service.
      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          cp coverage/report/badge_linecoverage.svg "$RUNNER_TEMP/coverage.svg"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin badges; then
            git switch -C badges FETCH_HEAD
          else
            git switch --orphan badges
          fi
          git rm -rf --quiet --ignore-unmatch .
          git clean -fdxq
          cp "$RUNNER_TEMP/coverage.svg" coverage.svg
          git add coverage.svg
          git diff --cached --quiet || { git commit -qm "Update coverage badge"; git push origin badges; }

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/report
          retention-days: 14

      - name: Pack (validation only)
        run: dotnet pack HeroKit/HeroKit.csproj --no-build -c Release --output ./nuget

  aot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish with Native AOT
        run: |
          dotnet publish HeroKit.AotSmokeTest/HeroKit.AotSmokeTest.csproj -c Release -r linux-x64 -o ./aot 2>&1 | tee publish.log
          if grep -E "warning IL[0-9]+" publish.log; then
            echo "::error::Trimming or AOT warnings found"
            exit 1
          fi

      - name: Run
        run: ./aot/HeroKit.AotSmokeTest
