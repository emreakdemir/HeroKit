name: Bug report
description: Report something that does not work as expected
labels: ["bug"]
body:
  - type: input
    id: herokit-version
    attributes:
      label: HeroKit version
      placeholder: "1.0.2"
    validations:
      required: true
  - type: input
    id: dotnet-version
    attributes:
      label: .NET version
      description: Output of `dotnet --version`, and the target framework.
      placeholder: "10.0.100 (net10.0)"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Code to reproduce
      description: A short snippet that shows the problem.
      render: csharp
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
